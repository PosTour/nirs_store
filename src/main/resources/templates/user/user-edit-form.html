<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование пользователя</title>
    <link rel="stylesheet" th:href="@{/css/item.css}">
</head>
<body>

<div class="container">
    <header>
        <h1>Редактирование пользователя</h1>
    </header>
    <form th:method="PATCH" th:action="@{/admin/user/update/{id}(id=${user.getId()})}" th:object="${user}">
        <div class="form-group">
            <label for="username">Логин</label>
            <input type="text" id="username" name="username" th:value="${user.getUsername()}" required />
        </div>

        <div class="form-group">
            <label for="name">Имя</label>
            <input type="text" id="name" name="name" th:value="${user.getName()}" required />
        </div>

        <div class="form-group">
            <label for="surname">Фамилия</label>
            <input type="text" id="surname" name="surname" th:value="${user.getSurname()}" required />
        </div>

        <div class="form-group">
            <label for="phone">Телефон</label>
            <input type="text" id="phone" name="phone" th:value="${user.getPhone()}" required />
        </div>

        <div class="form-group">
            <label for="role">Роль</label>
            <select id="role" name="role" required>
                <option value="ADMIN" th:selected="${user.getRole() == 'ADMIN'}">ADMIN</option>
                <option value="EMPLOYEE" th:selected="${user.getRole() == 'EMPLOYEE'}">EMPLOYEE</option>
            </select>
        </div>

        <button type="submit" class="submit-btn">Сохранить</button>
        <a th:href="@{/admin/user/find_all}" class="back-btn">Отмена</a>
    </form>

</div>

</body>
</html>
