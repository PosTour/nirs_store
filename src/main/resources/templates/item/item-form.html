<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание товара</title>
    <link rel="stylesheet" th:href="@{/css/item.css}">
</head>
<body>

<div class="container">
    <header>
        <h1>Создание товара</h1>
    </header>
    <form th:method="POST" th:action="@{/item/add}" th:object="${item}">
        <div class="form-group">
            <label for="name">Наименование</label>
            <input type="text" id="name" name="name" required />
        </div>

        <div class="form-group">
            <label for="description">Описание</label>
            <textarea id="description" name="description" rows="4" required></textarea>
        </div>

        <div class="form-group">
            <label for="quantity">Количество</label>
            <input type="number" id="quantity" name="quantity" min="0" required />
        </div>

        <div class="form-group">
            <label for="purchasePrice">Закупочная цена</label>
            <input type="number" step="0.01" id="purchasePrice" name="purchasePrice" required />
        </div>

        <div class="form-group">
            <label for="sellingPrice">Цена для продажи</label>
            <input type="number" step="0.01" id="sellingPrice" name="sellingPrice" required />
        </div>

        <div class="form-group">
            <label for="category">Категория</label>
            <select id="category" name="categoryId" required>
                <option value="" disabled selected>Выбрать категорию</option>
                <option th:each="category : ${categories}"
                        th:value="${category.getId()}"
                        th:text="${category.getName()}"></option>
            </select>
        </div>

        <button type="submit" class="submit-btn">Создать</button>
    </form>

</div>

</body>
</html>
