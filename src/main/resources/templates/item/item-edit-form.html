<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование товара</title>
    <link rel="stylesheet" th:href="@{/css/item.css}">
</head>
<body>

<div class="container">
    <header>
        <h1>Редактирование товара</h1>
    </header>
    <form th:method="PATCH" th:action="@{/item/update/{id}(id=${item.getId()})}" th:object="${item}">
        <div class="form-group">
            <label for="name">Наименование</label>
            <input type="text" id="name" name="name" th:value="${item.getName()}" required />
        </div>

        <div class="form-group">
            <label for="description">Описание</label>
            <textarea id="description" name="description" rows="4" required th:text="${item.getDescription()}"></textarea>
        </div>

        <div class="form-group">
            <label for="quantity">Количество</label>
            <input type="number" id="quantity" name="quantity" min="0" th:value="${item.getQuantity()}" required />
        </div>

        <div class="form-group">
            <label for="purchasePrice">Закупочная цена</label>
            <input type="number" step="0.01" id="purchasePrice" name="purchasePrice" th:value="${item.getPurchasePrice()}" required />
        </div>

        <div class="form-group">
            <label for="sellingPrice">Цена для продажи</label>
            <input type="number" step="0.01" id="sellingPrice" name="sellingPrice" th:value="${item.getSellingPrice()}" required />
        </div>

        <div class="form-group">
            <label for="category">Категория</label>
            <select id="category" name="categoryId" required>
                <option value="" disabled>Выбрать категорию</option>
                <option th:each="category : ${categories}"
                        th:value="${category.getId()}"
                        th:selected="${category.getId()} == ${item.getCategory().getId()}"
                        th:text="${category.getName()}"></option>
            </select>
        </div>

        <button type="submit" class="submit-btn">Сохранить</button>
        <a th:href="@{/item/find_all}" class="back-btn">Отмена</a>
    </form>

</div>

</body>
</html>
