<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование клиента</title>
    <link rel="stylesheet" th:href="@{/css/client.css}">
</head>
<body>

<div class="container">
    <header>
        <h1>Редактирование клиента</h1>
    </header>
    <form th:method="PATCH" th:action="@{/client/update/{id}(id=${client.getId()})}" th:object="${client}">
        <div class="form-group">
            <label for="name">ФИО</label>
            <input type="text" id="name" name="name" th:value="${client.getName()}" required />
        </div>

        <div class="form-group">
            <label for="phone">Телефон</label>
            <input type="text" id="phone" name="phone" th:value="${client.getPhone()}" required />
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" th:value="${client.getEmail()}" required />
        </div>

        <button type="submit" class="submit-btn">Сохранить</button>
        <a th:href="@{/client/find_all}" class="back-btn">Отмена</a>
    </form>

</div>

</body>
</html>
